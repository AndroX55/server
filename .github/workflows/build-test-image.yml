name: Build Test Image

on:
  push:
    branches:
      - ugp-http10-test

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Show dist
        run: |
          ls -lah dist/

      - name: Rename wheel
        run: |
          cp dist/music_assistant-0.0.0-py3-none-any.whl \
             dist/music_assistant-2.9.0-py3-none-any.whl

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/androx55/server:ugp-http10-test
          build-args: |
            MASS_VERSION=2.9.0
            BASE_IMAGE_VERSION=latest
